[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eht-receiver"
version = "0.1.0"
description = "Python orchestration for the CUDA Wi-Fi 7 EHT receiver"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.9",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
eht-receiver = "eht_receiver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eht_receiver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
